<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b27">
  <title>Scenario is loading… · Argo CD RemoteLab</title>
  <style>
    :root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f8f5f1;background:#071b27}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;padding:20px 0;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% 34%,#164459 0%,#0b2939 45%,#071b27 100%)}
    .ocean{position:fixed;inset:0;overflow:hidden;pointer-events:none;isolation:isolate}
    .ocean::before{content:"";position:absolute;inset:-15%;background:radial-gradient(circle at 20% 35%,#74d2d521,transparent 21%),radial-gradient(circle at 80% 70%,#ef7b4d1e,transparent 23%);animation:tide 16s ease-in-out infinite alternate}
    .ocean::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 69px,#a7e8e708 70px,transparent 71px 140px);opacity:.55}
    .swimmer{position:absolute;top:var(--top);left:0;width:var(--size);color:var(--color,#ef7b4d);opacity:var(--opacity,.65);animation:swim var(--duration) linear infinite;animation-delay:var(--delay)}
    .swimmer.reverse{animation-name:swim-back}
    .swimmer svg{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 15px #0005);animation:float 2.8s ease-in-out infinite alternate}
    .swimmer:nth-child(3n) svg{animation-duration:3.6s}
    .bubbles{position:absolute;inset:0;background:radial-gradient(circle at 12% 72%,#c8f5f58c 0 2px,transparent 3px),radial-gradient(circle at 18% 66%,#c8f5f551 0 3px,transparent 4px),radial-gradient(circle at 83% 23%,#c8f5f57a 0 2px,transparent 3px),radial-gradient(circle at 77% 29%,#c8f5f542 0 4px,transparent 5px),radial-gradient(circle at 57% 82%,#c8f5f54c 0 3px,transparent 4px);animation:bubbles 11s ease-in-out infinite alternate}
    main{position:relative;z-index:1;width:min(510px,calc(100% - 32px));padding:38px 42px 40px;border:1px solid #b7e5e02e;border-radius:22px;background:#071b27db;box-shadow:0 22px 90px #00121eb3,0 0 45px #66d4ce0d;backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:10px;color:#ffd4b8;font-size:13px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
    .brand svg{width:29px;height:29px;color:#ef7b4d}
    .eyebrow{margin:30px 0 8px;color:#73d1d4;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(27px,5vw,36px);line-height:1.17;letter-spacing:-.035em}
    .description{margin:17px 0 0;color:#c5d9df;line-height:1.65}
    .mission{margin:26px 0 0;padding:12px 15px;border:1px solid #9ddbd524;border-radius:10px;background:#a7e8e70c;color:#e3f5f4}
    .mission span{display:block;color:#83b6bf;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .mission strong{display:block;margin-top:3px;font-size:14px;font-weight:600}
    .track{height:6px;margin-top:27px;overflow:hidden;border-radius:999px;background:#a1d9da24}
    .track::before{content:"";display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ef7b4d,#ffc190 60%,#fff0d9);box-shadow:0 0 16px #ef7b4dbb;animation:load 2.3s ease-in-out infinite alternate}
    #status{min-height:1.5em;margin:13px 0 0;color:#9fc2ca;font-size:13px}
    #return{display:inline-block;margin-top:18px;color:#ffd4b8;font-weight:650;text-underline-offset:3px}
    #return:focus-visible{outline:2px solid #73d1d4;outline-offset:4px}
    [hidden]{display:none!important}
    @keyframes swim{from{transform:translate3d(-18vw,3vh,0) rotate(-5deg)}to{transform:translate3d(118vw,-3vh,0) rotate(6deg)}}
    @keyframes swim-back{from{transform:translate3d(118vw,-2vh,0) rotate(5deg)}to{transform:translate3d(-18vw,3vh,0) rotate(-6deg)}}
    @keyframes float{from{transform:translateY(-6px) rotate(-5deg)}to{transform:translateY(6px) rotate(5deg)}}
    @keyframes tide{to{transform:translate3d(4%,3%,0) scale(1.08)}}
    @keyframes bubbles{to{transform:translateY(-25px)}}
    @keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media(max-width:520px){main{padding:30px 25px 32px}.swimmer{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.ocean::before,.bubbles,.swimmer,.swimmer svg,.track::before{animation:none}.swimmer{left:var(--still)}.track::before{width:65%}}
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="argo-octopus" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M35 70C25 78 22 93 10 87c-5-3-3-10 1-11M41 76c-9 11-9 24-19 28-7 3-12-2-10-8M49 80c-5 12-1 24-8 30-5 4-11 1-12-4M57 82c-1 13 5 23 0 29-4 5-10 3-12-1M65 82c1 13-5 23 0 29 4 5 10 3 12-1M73 80c5 12 1 24 8 30 5 4 11 1 12-4M81 76c9 11 9 24 19 28 7 3 12-2 10-8M87 70c10 8 13 23 25 17 5-3 3-10-1-11"/>
      </g>
      <path fill="currentColor" d="M26 50c0-23 14-38 34-38s34 15 34 38v12c0 18-14 27-34 27S26 80 26 62Z"/>
      <path fill="#fff2e2" opacity=".55" d="M37 37c4-10 12-16 21-17-7 5-12 11-14 20Z"/>
      <ellipse cx="47" cy="54" rx="7" ry="9" fill="#fff8f0"/>
      <ellipse cx="73" cy="54" rx="7" ry="9" fill="#fff8f0"/>
      <circle cx="49" cy="56" r="3.2" fill="#183541"/>
      <circle cx="71" cy="56" r="3.2" fill="#183541"/>
      <path d="M52 69q8 7 16 0" fill="none" stroke="#8e3b35" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
  </svg>
  <div class="ocean" aria-hidden="true">
    <div class="bubbles"></div>
    <span class="swimmer" style="--top:7%;--still:8%;--size:100px;--duration:25s;--delay:-3s;--opacity:.8"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:18%;--still:73%;--size:66px;--duration:29s;--delay:-17s;--opacity:.6"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer" style="--top:36%;--still:17%;--size:75px;--duration:22s;--delay:-10s;--opacity:.56"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:65%;--still:84%;--size:108px;--duration:31s;--delay:-8s;--opacity:.76"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer" style="--top:82%;--still:42%;--size:64px;--duration:27s;--delay:-21s;--opacity:.55"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:9%;--still:42%;--size:49px;--duration:20s;--delay:-14s;--opacity:.45"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer" style="--top:55%;--still:5%;--size:56px;--duration:34s;--delay:-28s;--opacity:.43"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:77%;--still:20%;--size:78px;--duration:24s;--delay:-18s;--opacity:.7"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer" style="--top:23%;--still:89%;--size:92px;--duration:32s;--delay:-24s;--opacity:.52"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:49%;--still:64%;--size:60px;--duration:26s;--delay:-6s;--opacity:.42"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer" style="--top:91%;--still:70%;--size:96px;--duration:30s;--delay:-12s;--opacity:.5"><svg><use href="#argo-octopus"/></svg></span>
    <span class="swimmer reverse" style="--top:3%;--still:61%;--size:73px;--duration:28s;--delay:-25s;--opacity:.5"><svg><use href="#argo-octopus"/></svg></span>
  </div>
  <main>
    <div class="brand"><svg aria-hidden="true"><use href="#argo-octopus"/></svg>Argo CD RemoteLab</div>
    <p class="eyebrow">Preparing your mission</p>
    <h1 id="heading">Scenario is loading…</h1>
    <p class="description">The lab is setting up your environment and waiting for the mission evidence to appear. Argo CD will open automatically when it is ready.</p>
    <div class="mission"><span>Selected mission</span><strong id="mission-name">Loading mission…</strong></div>
    <div class="track" id="progress" role="progressbar" aria-label="Scenario preparation in progress"></div>
    <p id="status" role="status" aria-live="polite">Connecting to the lab…</p>
    <a id="return" href="/" hidden>Back to missions</a>
  </main>
  <script>
    (()=>{
      const key='argo-coach:preparing';
      const heading=document.querySelector('#heading');
      const description=document.querySelector('.description');
      const status=document.querySelector('#status');
      const mission=document.querySelector('#mission-name');
      const progress=document.querySelector('#progress');
      const returnLink=document.querySelector('#return');
      let pending;
      try{pending=JSON.parse(sessionStorage.getItem(key)||'null')}catch(_){pending=null}
      const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      function setStatus(message){if(status.textContent!==message)status.textContent=message}
      function fail(message){
        document.title='Scenario could not load · Argo CD RemoteLab';
        heading.textContent='Scenario could not load';
        description.textContent='This mission could not be prepared. You can return to the launcher and try again.';
        setStatus(message);
        progress.hidden=true;
        returnLink.hidden=false;
      }
      if(!pending?.run_id||!pending?.session_id||!pending?.token){
        fail('No mission is being prepared in this tab.');
        return;
      }
      mission.textContent=pending.title||'Argo CD mission';
      const phase={CREATED:'Starting the mission…',RESETTING:'Restoring the shop environment…',
        INJECTING:'Applying the scenario changes…',AWAITING_DETECTION:'Waiting for the scenario evidence to appear…'};
      async function watch(){
        while(true){
          try{
            const response=await fetch('/coach/learning/api/runs/'+encodeURIComponent(pending.run_id),{cache:'no-store'});
            const run=await response.json();
            if(response.status===404){fail('This mission is no longer available. Start a new one from the launcher.');return}
            if(!response.ok)throw new Error(run.error||'The lab is temporarily unavailable.');
            if(run.id!==pending.run_id)throw new Error('The lab returned a different mission.');
            if(['FAILED','ABORTED','COMPLETED'].includes(run.state)){
              fail(run.error||(run.state==='ABORTED'?'This mission was replaced by another run.':'The mission ended before it became ready.'));
              return;
            }
            if(['READY','INVESTIGATING','FIXED'].includes(run.state)){
              setStatus('Scenario ready. Connecting to Argo CD…');
              const login=await fetch('/coach/learning/api/auth/argocd',{credentials:'same-origin',cache:'no-store'});
              const auth=await login.json();
              if(!login.ok||!auth.authenticated)throw new Error(auth.error||'Argo CD sign-in is temporarily unavailable.');
              const viewKey='argo-coach:initial-view:'+pending.session_id;
              let view;
              try{view=JSON.parse(sessionStorage.getItem(viewKey)||'null')}catch(_){view=null}
              if(view?.run_id===pending.run_id){
                view.state=run.state;
                view.run_updated_at=run.updated_at;
                sessionStorage.setItem(viewKey,JSON.stringify(view));
              }
              sessionStorage.setItem('argo-coach:argocd-authenticated','true');
              sessionStorage.setItem('argo-coach:handoff',JSON.stringify({session:pending.session_id,
                token:pending.token,run:pending.run_id,mode:pending.mode}));
              sessionStorage.removeItem(key);
              location.replace('/argocd/applications');
              return;
            }
            setStatus(phase[run.state]||'Preparing the scenario…');
          }catch(error){setStatus('Connection interrupted. Retrying…')}
          await delay(2000);
        }
      }
      watch();
    })();
  </script>
</body>
</html>
