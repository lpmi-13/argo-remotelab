kind: playground
name: argo-remotelab-3bf4e8fb
base: flexbox
title: Argo RemoteLab
description: Learn the Argo CD console by diagnosing and fixing GitOps failures.
categories:
  - kubernetes
  - ci-cd
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: cplane-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            Open the argocd tab to choose a mission and assistance mode.

            Credentials:
            - Argo CD: learner / remotelab

            Clone the lab repo to fix scenarios that need a git push:
              git clone http://remotelab:remotelab@127.0.0.1:30082/remotelab/django-app.git

            The SOPS key to use is at /var/lib/argo-remotelab/secrets/local.key
      drives:
        - source: oci://ghcr.io/lpmi-13/argo-remotelab-k3s-rootfs:v9
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.2/24
            network: local
      resources:
        cpuCount: 4
        ramSize: 8GiB
  tabs:
    - id: terminal-cplane-01
      kind: terminal
      name: cplane-01
      machine: cplane-01
    - id: http-port-argocd
      kind: http-port
      name: argocd
      machine: cplane-01
      number: 30080
      access: public
  initTasks:
    init_cplane_01_1:
      name: init_cplane_01_1
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 1800
      run: |-
        #!/bin/bash
        set -euo pipefail

        for _ in $(seq 1 360); do
          curl -fsS http://127.0.0.1:30080/healthz >/dev/null && exit 0
          sleep 5
        done
        echo 'lab gateway did not become ready' >&2
        exit 1
  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
