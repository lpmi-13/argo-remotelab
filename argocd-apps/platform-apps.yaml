apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  labels: {env: shared, team: platform}
spec:
  project: platform
  source:
    repoURL: http://gitea.applications.svc.cluster.local:3000/remotelab/django-app.git
    targetRevision: main
    path: platform/config
  destination: {server: https://kubernetes.default.svc, namespace: applications}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-policy
  namespace: argocd
  labels: {env: shared, team: platform}
spec:
  project: platform
  source:
    repoURL: http://gitea.applications.svc.cluster.local:3000/remotelab/django-app.git
    targetRevision: main
    path: platform/release-policy
  destination: {server: https://kubernetes.default.svc, namespace: applications}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-config
  namespace: argocd
  labels: {env: shared, team: platform}
spec:
  project: platform
  source:
    repoURL: http://gitea.applications.svc.cluster.local:3000/remotelab/django-app.git
    targetRevision: main
    path: platform/ingress-config
  destination: {server: https://kubernetes.default.svc, namespace: applications}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
