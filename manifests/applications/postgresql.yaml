apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: applications
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      initContainers:
      - name: reject-old-postgresql-data
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - |
          for version_file in /var/lib/postgresql/PG_VERSION /var/lib/postgresql/data/PG_VERSION /var/lib/postgresql/*/docker/PG_VERSION; do
            [ -f "$version_file" ] || continue
            data_version="$(cat "$version_file")"
            if [ "$data_version" != "18" ]; then
              echo "PostgreSQL data is version $data_version at $version_file; migrate it to 18 or run a full lab reset before using postgres:18.6." >&2
              exit 1
            fi
          done
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql
      containers:
      - name: postgresql
        image: postgres:18.6
        env:
        - name: POSTGRES_DB
          value: "gitea"
        - name: POSTGRES_USER
          value: "gitea"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
      - name: init-scripts
        configMap:
          name: postgresql-init-scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: applications
data:
  create-django-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE USER remotelab WITH PASSWORD 'remotelab';
      CREATE DATABASE remotelab OWNER remotelab;
      GRANT ALL PRIVILEGES ON DATABASE remotelab TO remotelab;
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: applications
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: applications
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: applications
type: Opaque
data:
  password: Z2l0ZWFfcGFzc3dvcmQ=  # "gitea_password" base64 encoded
