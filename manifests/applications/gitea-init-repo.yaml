apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-init-repo
  namespace: applications
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: gitea-init-repo
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-gitea
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Gitea to be ready..."
          attempts=0
          until curl -sf http://gitea:3000/api/healthz > /dev/null; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 60 ]; then
              echo "Gitea failed to become ready"
              exit 1
            fi
            sleep 5
          done
          echo "Gitea is ready!"
          sleep 3
      containers:
      - name: init-repo
        image: alpine:3.19
        env:
        - name: SOPS_AGE_KEY
          valueFrom:
            secretKeyRef:
              name: sops-age-key
              key: key.txt
        - name: AGE_PUBLIC_KEY
          valueFrom:
            configMapKeyRef:
              name: sops-config
              key: age-public-key
        command:
        - sh
        - -c
        - |
          set -ex
          apk add --no-cache git curl jq

          # Install sops and age
          wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.0/sops-v3.13.0.linux.amd64
          chmod +x /usr/local/bin/sops
          wget -qO- https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz | tar xz -C /tmp
          mv /tmp/age/age /usr/local/bin/
          mv /tmp/age/age-keygen /usr/local/bin/
          chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

          GITEA_URL="http://gitea:3000"
          USERNAME="remotelab"
          PASSWORD="remotelab"
          REPO_NAME="django-app"

          # Delete repo if exists for fresh init
          REPO_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "$USERNAME:$PASSWORD" \
            "$GITEA_URL/api/v1/repos/$USERNAME/$REPO_NAME")

          if [ "$REPO_CHECK" = "200" ]; then
            echo "Deleting existing repository..."
            curl -X DELETE "$GITEA_URL/api/v1/repos/$USERNAME/$REPO_NAME" \
              -u "$USERNAME:$PASSWORD"
            sleep 3
          fi

          echo "Creating repository..."
          curl -X POST "$GITEA_URL/api/v1/user/repos" \
            -H "Content-Type: application/json" \
            -u "$USERNAME:$PASSWORD" \
            -d "{
              \"name\": \"$REPO_NAME\",
              \"description\": \"Django application with Helm chart and SOPS secrets\",
              \"private\": false,
              \"auto_init\": true,
              \"default_branch\": \"main\"
            }"
          sleep 3

          git config --global user.email "remotelab@localhost.local"
          git config --global user.name "Remotelab"
          git config --global init.defaultBranch main

          # Clone source from GitHub
          echo "Cloning source from GitHub..."
          clone_attempts=0
          until git clone --depth 1 "https://github.com/lpmi-13/argo-remotelab.git" /tmp/source 2>&1; do
            clone_attempts=$((clone_attempts + 1))
            if [ $clone_attempts -ge 5 ]; then
              echo "Failed to clone from GitHub"
              exit 1
            fi
            rm -rf /tmp/source
            sleep 10
          done

          # Prepare repo
          mkdir -p /workspace/repo
          cd /workspace/repo

          # Copy the Helm chart
          cp -r /tmp/source/sample-django-app/chart .
          cp -r /tmp/source/sample-django-app/platform .

          # Create .sops.yaml at the chart level
          cat > chart/django-app/.sops.yaml <<EOF
          creation_rules:
            - path_regex: '.*\.enc$'
              age: '$AGE_PUBLIC_KEY'
          EOF

          # Create plaintext secrets and encrypt them
          cat > /tmp/secrets-plain.yaml <<EOF
          secrets:
            DB_PASSWORD: "remotelab"
            SECRET_KEY: "django-production-secret-key-argo-remotelab-2024"
            API_TOKEN: "tok_prod_abc123def456"
          EOF

          # Write age key for sops
          echo "$SOPS_AGE_KEY" > /tmp/age-key.txt
          export SOPS_AGE_KEY_FILE=/tmp/age-key.txt

          sops --encrypt --age "$AGE_PUBLIC_KEY" /tmp/secrets-plain.yaml > chart/django-app/secrets.yaml.enc
          cp -r chart/django-app chart/django-app-staging
          sed -i 's/DB_HOST: "postgresql"/DB_HOST: "postgresql.applications.svc.cluster.local"/;s/APP_ENVIRONMENT: "production"/APP_ENVIRONMENT: "staging"/' chart/django-app-staging/values.yaml
          echo "Created encrypted secrets file"

          # Verify the encrypted file
          echo "Encrypted file contents:"
          cat chart/django-app/secrets.yaml.enc

          # Create README
          cat > README.md <<'READMEEOF'
          # Django Application

          Helm chart managed by ArgoCD with SOPS-encrypted secrets.

          ## Structure

          - `chart/django-app/` - Helm chart
            - `values.yaml` - Application configuration
            - `secrets.yaml.enc` - SOPS-encrypted secrets
            - `templates/` - Kubernetes resource templates

          ## Editing Secrets

          ```bash
          export SOPS_AGE_KEY_FILE=path/to/key.txt
          sops chart/django-app/secrets.yaml.enc
          ```
          READMEEOF

          # Init git and push
          git init
          git add -A
          git commit -m "Initial commit: Django app with Helm chart and SOPS secrets"
          git tag baseline

          git remote add origin "http://$USERNAME:$PASSWORD@gitea:3000/$USERNAME/$REPO_NAME.git"
          git pull origin main --allow-unrelated-histories --no-edit 2>&1 || true
          git push -f -u origin main 2>&1
          git push origin baseline 2>&1

          echo "Django app repository initialized successfully"
