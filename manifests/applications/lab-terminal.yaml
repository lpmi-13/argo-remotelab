apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-terminal
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-terminal}
  template:
    metadata:
      labels: {app: lab-terminal}
    spec:
      serviceAccountName: lab-terminal
      containers:
      - name: terminal
        image: ghcr.io/lpmi-13/argo-remotelab-lab-terminal:v7
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 7681
        env:
        - name: GITEA_USERNAME
          value: remotelab
        - name: GITEA_PASSWORD
          value: remotelab
        - name: LAB_TERMINAL_TOKEN
          value: remotelab-local-terminal
        - name: LEARNING_SERVICE_URL
          value: http://learning-service.applications.svc.cluster.local:8091
        volumeMounts:
        - name: age-key
          mountPath: /secrets
          readOnly: true
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
      volumes:
      - name: age-key
        secret:
          secretName: sops-age-key
          items:
          - key: key.txt
            path: age-key.txt
---
apiVersion: v1
kind: Service
metadata:
  name: lab-terminal
  namespace: applications
spec:
  selector: {app: lab-terminal}
  ports:
  - name: http
    port: 7681
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-terminal
  namespace: applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-terminal-workload
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-terminal-workload
  namespace: applications
subjects:
- kind: ServiceAccount
  name: lab-terminal
  namespace: applications
roleRef: {kind: ClusterRole, name: lab-terminal-workload, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-terminal-workload
  namespace: shop-staging
subjects:
- kind: ServiceAccount
  name: lab-terminal
  namespace: applications
roleRef: {kind: ClusterRole, name: lab-terminal-workload, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-terminal-apps
  namespace: argocd
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-terminal-apps
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: lab-terminal
  namespace: applications
roleRef: {kind: Role, name: lab-terminal-apps, apiGroup: rbac.authorization.k8s.io}
