# ArgoCD SOPS Configuration
# Configures ArgoCD to decrypt SOPS-encrypted secrets using helm-secrets plugin
---
# ConfigMap to configure helm-secrets plugin
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  accounts.learner: login
  accounts.learner.enabled: "true"
  # Enable helm-secrets plugin for decrypting SOPS files
  helm.valuesFileSchemes: >-
    secrets+gpg-import, secrets+gpg-import-kubernetes,
    secrets+age-import, secrets+age-import-kubernetes,
    secrets, secrets+literal,
    https, http
---
# Patch for repo-server to mount SOPS age key and install helm-secrets plugin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
      - name: install-helm-secrets
        image: alpine:3.24.2
        command:
        - sh
        - -c
        - |
          set -eu
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          # Install helm-secrets plugin
          wget -qO- https://github.com/jkroepke/helm-secrets/releases/download/v4.7.8/helm-secrets.tar.gz | tar xz -C /custom-tools
          # Remove platformCommand to avoid Helm 3.19+ warning that breaks ArgoCD
          sed -i '/^platformCommand:/,/^[^ ]/{ /^platformCommand:/d; /^  /d; /^$/d; }' /custom-tools/helm-secrets/plugin.yaml
          # Install sops binary into a directory that is in the default PATH
          wget -qO /sops-bin/sops "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.${arch}"
          chmod +x /sops-bin/sops
          # Install age binary
          wget -qO- "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-${arch}.tar.gz" | tar xz -C /tmp
          mv /tmp/age/age /sops-bin/
          mv /tmp/age/age-keygen /sops-bin/
          chmod +x /sops-bin/age /sops-bin/age-keygen
        volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
        - name: sops-bin
          mountPath: /sops-bin

      containers:
      - name: argocd-repo-server
        env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops-age-key/key.txt
        - name: HELM_PLUGINS
          value: /custom-tools
        - name: PATH
          value: /custom-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: HELM_SECRETS_SOPS_PATH
          value: /usr/local/sbin/sops
        volumeMounts:
        - name: sops-age-key
          mountPath: /sops-age-key
          readOnly: true
        - name: custom-tools
          mountPath: /custom-tools
          readOnly: true
        - name: sops-bin
          mountPath: /usr/local/sbin
          readOnly: true

      volumes:
      - name: sops-age-key
        secret:
          secretName: sops-age-key
      - name: custom-tools
        emptyDir: {}
      - name: sops-bin
        emptyDir: {}
