image:
  registry: ghcr.io
  repository: lpmi-13/argo-remotelab-django
  tag: v7
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  DEBUG: "false"
  SECRET_KEY: "django-insecure-remotelab-key-change-in-production"
  FORCE_SCRIPT_NAME: "/django"
  DATABASE_ENGINE: "postgresql"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "remotelab"
  DB_USER: "remotelab"
  DB_PASSWORD: "remotelab"

# SOPS-encrypted secrets (overrides env values above when decrypted)
# These values are managed via sops and decrypted by ArgoCD's helm-secrets plugin
secrets: {}

persistence:
  enabled: false

healthCheck:
  path: /api/health/
  readinessInitialDelay: 15
  livenessInitialDelay: 30

# A release verification hook is enabled only in the stuck-sync exercise.
lab:
  postSyncVerify: false

metrics:
  enabled: true
  port: "8000"
  path: "/metrics"

# ConfigMap that the app expects to exist
appConfig:
  enabled: true
  data:
    APP_ENVIRONMENT: "production"
    FEATURE_FLAGS: "inventory_v2=true,async_reports=true"
    MAX_CONNECTIONS: "100"
    LOG_LEVEL: "INFO"
