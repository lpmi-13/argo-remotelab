apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "django-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "django-app.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:18.6
        env:
        - name: PGHOST
          value: {{ .Values.env.DB_HOST | quote }}
        - name: PGPORT
          value: {{ .Values.env.DB_PORT | quote }}
        - name: PGDATABASE
          value: {{ .Values.env.DB_NAME | quote }}
        - name: PGUSER
          value: {{ .Values.env.DB_USER | quote }}
        - name: PGPASSWORD
          value: {{ .Values.env.DB_PASSWORD | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Waiting for database at $PGHOST:$PGPORT..."
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -d "$PGDATABASE" -U "$PGUSER" -t 5 > /dev/null 2>&1; then
              echo "Database is ready"
              exit 0
            fi
            echo "Database not ready yet (attempt $attempt/$max_attempts)..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "ERROR: Database did not become ready"
          exit 1
      containers:
      - name: django
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.secrets }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        envFrom:
        {{- if .Values.appConfig.enabled }}
        - configMapRef:
            name: {{ include "django-app.fullname" . }}-config
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.healthCheck.readinessInitialDelay }}
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.healthCheck.livenessInitialDelay }}
          periodSeconds: 30
