apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate-{{ .Values.image.tag | replace "." "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "django-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: public.ecr.aws/docker/library/postgres:18.6
        env:
        - name: PGHOST
          value: {{ .Values.env.DB_HOST | quote }}
        - name: PGPORT
          value: {{ .Values.env.DB_PORT | quote }}
        - name: PGDATABASE
          value: {{ .Values.env.DB_NAME | quote }}
        - name: PGUSER
          value: {{ .Values.env.DB_USER | quote }}
        - name: PGPASSWORD
          value: {{ .Values.env.DB_PASSWORD | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Waiting for database..."
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -d "$PGDATABASE" -U "$PGUSER" -t 5 > /dev/null 2>&1; then
              echo "Database is ready for migrations"
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "ERROR: Database not ready for migrations"
          exit 1
      containers:
      - name: migrate
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- range $key, $value := .Values.secrets }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Running Django migrations..."
          python manage.py migrate --noinput
          echo "Migrations completed successfully"
