events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $external_scheme { default $scheme; https https; }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;
    access_log off;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location = /healthz { return 200 'ok'; }

    location /coach/assets/ {
      alias /usr/share/nginx/html/coach/assets/;
      add_header Cache-Control "no-store" always;
    }

    location /coach/learning/ {
      proxy_pass http://learning-service.applications.svc.cluster.local:8091/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location /terminal/ {
      proxy_pass http://lab-terminal.applications.svc.cluster.local:7681;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location = /argocd { return 302 /argocd/; }
    location /argocd/ {
      proxy_pass http://argocd-server.argocd.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_buffering off;
      proxy_read_timeout 180s;
      sub_filter_once on;
      # Argo emits a root base href with --basehref /argocd.
      # Relative bundle URLs must resolve under the gateway's Argo prefix.
      sub_filter '<base href="/">' '<base href="/argocd/">';
      sub_filter '</head>' '<script src="/coach/assets/argocd-bootstrap.js"></script><script defer src="/coach/assets/ui/theme.js"></script><script defer src="/coach/assets/step-clock.js"></script><script defer src="/coach/assets/action-observer.js"></script><script defer src="/coach/assets/coach.js"></script></head>';
    }

    location = /gitea { return 302 /gitea/; }
    location /gitea/ {
      proxy_pass http://gitea.applications.svc.cluster.local:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $external_scheme;
      proxy_set_header X-Forwarded-Prefix /gitea;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      # The preloaded VM cannot know the public iximiuz tab origin at boot.
      # Gitea uses its local fallback URL there; return browser-facing links
      # and redirects through whichever origin reached this gateway.
      proxy_redirect http://127.0.0.1:30080/gitea/ /gitea/;
      sub_filter_once off;
      sub_filter 'http://127.0.0.1:30080/gitea/' '$external_scheme://$http_host/gitea/';
      sub_filter '</head>' '<script src="/coach/assets/argocd-bootstrap.js"></script><script defer src="/coach/assets/ui/theme.js"></script><script defer src="/coach/assets/step-clock.js"></script><script defer src="/coach/assets/action-observer.js"></script><script defer src="/coach/assets/coach.js"></script></head>';
    }

    location / {
      root /usr/share/nginx/html/launcher;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
    }
  }
}
